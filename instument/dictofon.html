<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Диктофон — запись звука</title>
<style>
  :root{
    --accent:#4f8cff;
    --accent2:#6f4bff;
    --red:#ff4d5e;
    --card:rgba(255,255,255,.05);
    --border:rgba(255,255,255,.10);
    --muted:#8b9bb4;
    --text:#e8eef8;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 600px at 50% -10%, #1e2a44 0%, #0b1120 60%) fixed;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    flex:1 0 auto;
    width:100%;
    max-width:760px;
    margin:0 auto;
    padding:36px 16px 48px;
  }

  h1{ margin:0 0 6px; font-size:26px; letter-spacing:-.02em; }

  .subtitle{ margin:0 0 24px; color:var(--muted); font-size:14px; }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:22px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 20px 50px rgba(0,0,0,.35);
  }

  label{
    display:block;
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--muted);
    margin-bottom:8px;
  }

  input[type="text"]{
    width:100%;
    padding:13px 15px;
    font-size:16px;
    color:var(--text);
    background:rgba(0,0,0,.28);
    border:1px solid var(--border);
    border-radius:12px;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }

  input[type="text"]::placeholder{ color:#5f708c; }

  input[type="text"]:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 4px rgba(79,140,255,.18);
  }

  .hint{ margin:8px 0 0; font-size:13px; color:var(--muted); }

  .controls{
    margin-top:22px;
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
  }

  #recordBtn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 26px;
    font-size:16px;
    font-weight:600;
    color:#fff;
    border:none;
    border-radius:999px;
    cursor:pointer;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow:0 10px 26px rgba(79,140,255,.35);
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
    user-select:none;
  }

  #recordBtn:hover:not(:disabled){ transform:translateY(-1px); }
  #recordBtn:active:not(:disabled){ transform:translateY(1px) scale(.99); }
  #recordBtn:disabled{ opacity:.55; cursor:not-allowed; }

  #recordBtn.recording{
    background:linear-gradient(135deg, #ff4d5e, #ff7a45);
    animation:pulse 1.5s infinite;
  }

  @keyframes pulse{
    0%   { box-shadow:0 0 0 0 rgba(255,77,94,.55); }
    70%  { box-shadow:0 0 0 16px rgba(255,77,94,0); }
    100% { box-shadow:0 0 0 0 rgba(255,77,94,0); }
  }

  .timer{
    font-variant-numeric:tabular-nums;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:22px;
    color:var(--muted);
    letter-spacing:.04em;
  }

  .timer.active{ color:#ff8a94; }

  #status{
    margin-top:16px;
    font-size:14px;
    min-height:20px;
    color:var(--muted);
  }

  #status.ok{ color:#5ce09a; }
  #status.error{ color:#ff7b88; }
  #status.info{ color:#8fb7ff; }

  #list{
    margin-top:24px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .recording{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    animation:appear .25s ease;
  }

  @keyframes appear{
    from{ opacity:0; transform:translateY(8px); }
    to  { opacity:1; transform:translateY(0); }
  }

  .rec-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
  }

  .rec-name{
    font-weight:600;
    font-size:15px;
    word-break:break-all;
  }

  .rec-dur{
    flex:none;
    font-size:13px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  audio{
    width:100%;
    height:40px;
    display:block;
    border-radius:10px;
    outline:none;
  }

  .rec-actions{
    margin-top:12px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }

  .btn-dl, .btn-del{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:9px 16px;
    font-size:14px;
    font-weight:600;
    border-radius:10px;
    cursor:pointer;
    text-decoration:none;
    border:1px solid transparent;
    transition:background .15s, border-color .15s, transform .1s;
  }

  .btn-dl{
    color:#0b1120;
    background:linear-gradient(135deg,#5ce09a,#38c9d6);
  }

  .btn-dl:hover{ filter:brightness(1.07); }

  .btn-del{
    color:#ffb3ba;
    background:rgba(255,77,94,.10);
    border-color:rgba(255,77,94,.35);
  }

  .btn-del:hover{ background:rgba(255,77,94,.20); }

  .btn-dl:active, .btn-del:active{ transform:scale(.98); }

  footer{
    flex:none;
    padding:18px 16px 22px;
    text-align:center;
    font-size:13px;
    color:var(--muted);
    border-top:1px solid rgba(255,255,255,.07);
  }

  footer a{ color:#7cc4ff; text-decoration:none; }
  footer a:hover{ text-decoration:underline; }

  @media (max-width:520px){
    .controls{ gap:14px; }
    #recordBtn{ width:100%; justify-content:center; }
    .timer{ font-size:20px; }
  }
</style>
</head>
<body>

  <main class="app">
    <h1>Диктофон</h1>
    <p class="subtitle">
      Запись звука с микрофона устройства. Итоговый файл сохраняется в формате MP3.
      Записи хранятся в браузере и не пропадают после обновления страницы.
    </p>

    <section class="card">
      <label for="fileName">Название файла</label>
      <input id="fileName" type="text" placeholder="Например: Иванов Иван Иванович" autocomplete="off" spellcheck="false">
      <p class="hint">ФИО или Код участника</p>

      <div class="controls">
        <button id="recordBtn" type="button">● Начать запись</button>
        <div id="timer" class="timer">00:00</div>
      </div>

      <div id="status"></div>
    </section>

    <section id="list"></section>
  </main>

  <footer>
    Автор: <a href="https://vk.ru/archigpt" target="_blank" rel="noopener noreferrer">vk.ru/archigpt</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>

  <script>
  (function () {
    'use strict';

    /* ---------- DOM ---------- */
    const fileNameInput = document.getElementById('fileName');
    const recordBtn     = document.getElementById('recordBtn');
    const timerEl       = document.getElementById('timer');
    const statusEl      = document.getElementById('status');
    const listEl        = document.getElementById('list');

    /* ---------- Состояние ---------- */
    let mediaRecorder = null;
    let stream        = null;
    let chunks        = [];
    let isRecording   = false;
    let isBusy        = false;
    let timerId       = null;
    let startedAt     = 0;

    const objectUrls = new Map(); // id -> object URL (для очистки при удалении)

    const MIME_CANDIDATES = [
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/ogg;codecs=opus',
      'audio/mp4',
      'audio/aac'
    ];

    /* ---------- IndexedDB ---------- */
    const DB_NAME    = 'dictaphone-db';
    const DB_VERSION = 1;
    const STORE      = 'recordings';

    let dbPromise = null;

    function openDB() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) {
          reject(new Error('IndexedDB не поддерживается браузером'));
          return;
        }
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE)) {
            db.createObjectStore(STORE, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror   = () => reject(req.error || new Error('Ошибка открытия IndexedDB'));
      });
      return dbPromise;
    }

    async function dbPut(record) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(record);
        tx.oncomplete = () => resolve();
        tx.onerror    = () => reject(tx.error);
        tx.onabort    = () => reject(tx.error || new Error('Транзакция отменена'));
      });
    }

    async function dbGetAll() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx  = db.transaction(STORE, 'readonly');
        const req = tx.objectStore(STORE).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror   = () => reject(req.error);
      });
    }

    async function dbDelete(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror    = () => reject(tx.error);
      });
    }

    /* ---------- Вспомогательные ---------- */
    function setStatus(text, type) {
      statusEl.textContent = text || '';
      statusEl.className = type || '';
    }

    function formatTime(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const pad = n => String(n).padStart(2, '0');
      return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
    }

    function getFileName() {
      let name = fileNameInput.value.trim();
      name = name.replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, ' ').trim();
      if (!name) name = 'Запись';
      return name;
    }

    function pickMimeType() {
      if (!window.MediaRecorder || typeof MediaRecorder.isTypeSupported !== 'function') return '';
      for (const type of MIME_CANDIDATES) {
        if (MediaRecorder.isTypeSupported(type)) return type;
      }
      return '';
    }

    function makeId() {
      return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
    }

    /* ---------- Таймер ---------- */
    function startTimer() {
      startedAt = Date.now();
      timerEl.textContent = '00:00';
      timerEl.classList.add('active');
      timerId = setInterval(() => {
        timerEl.textContent = formatTime((Date.now() - startedAt) / 1000);
      }, 250);
    }

    function stopTimer() {
      clearInterval(timerId);
      timerId = null;
      timerEl.classList.remove('active');
    }

    /* ---------- Конвертация в MP3 ---------- */
    function toInt16(float32) {
      const out = new Int16Array(float32.length);
      for (let i = 0; i < float32.length; i++) {
        const s = Math.max(-1, Math.min(1, float32[i]));
        out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      return out;
    }

    function encodeToMp3(audioBuffer, kbps) {
      if (typeof lamejs === 'undefined') {
        throw new Error('MP3-энкодер не загрузился. Проверьте подключение к интернету.');
      }

      const numChannels = Math.min(audioBuffer.numberOfChannels, 2);
      const sampleRate  = audioBuffer.sampleRate;
      const encoder     = new lamejs.Mp3Encoder(numChannels, sampleRate, kbps || 128);

      const blockSize = 1152;
      const left  = toInt16(audioBuffer.getChannelData(0));
      const right = numChannels > 1 ? toInt16(audioBuffer.getChannelData(1)) : null;

      const parts = [];

      for (let i = 0; i < left.length; i += blockSize) {
        const l = left.subarray(i, i + blockSize);
        const r = right ? right.subarray(i, i + blockSize) : undefined;
        const buf = numChannels > 1
          ? encoder.encodeBuffer(l, r)
          : encoder.encodeBuffer(l);
        if (buf.length > 0) parts.push(new Int8Array(buf));
      }

      const end = encoder.flush();
      if (end.length > 0) parts.push(new Int8Array(end));

      return new Blob(parts, { type: 'audio/mpeg' });
    }

    /* ---------- Отрисовка карточки записи ---------- */
    function renderRecording(record) {
      const { id, name, blob, duration } = record;
      const url = URL.createObjectURL(blob);
      objectUrls.set(id, url);

      const item = document.createElement('div');
      item.className = 'recording';
      item.dataset.id = id;

      const top = document.createElement('div');
      top.className = 'rec-top';

      const nameEl = document.createElement('div');
      nameEl.className = 'rec-name';
      nameEl.textContent = '🎙 ' + name + '.mp3';

      const durEl = document.createElement('div');
      durEl.className = 'rec-dur';
      durEl.textContent = formatTime(duration);

      top.append(nameEl, durEl);

      const audio = document.createElement('audio');
      audio.controls = true;
      audio.preload = 'metadata';
      audio.src = url;

      const actions = document.createElement('div');
      actions.className = 'rec-actions';

      const dl = document.createElement('a');
      dl.className = 'btn-dl';
      dl.href = url;
      dl.download = name + '.mp3';
      dl.textContent = '⬇ Скачать MP3';

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'btn-del';
      del.textContent = 'Удалить';
      del.addEventListener('click', async () => {
        audio.pause();
        try {
          await dbDelete(id);
        } catch (e) {
          console.warn('Не удалось удалить из IndexedDB:', e);
        }
        URL.revokeObjectURL(url);
        objectUrls.delete(id);
        item.remove();
        setStatus('Запись удалена: ' + name + '.mp3', 'info');
      });

      actions.append(dl, del);
      item.append(top, audio, actions);

      return item;
    }

    /* ---------- Сохранение новой записи ---------- */
    async function saveAndRender(record) {
      // Сначала пробуем сохранить в IndexedDB, чтобы запись не пропала
      let saved = false;
      try {
        await dbPut(record);
        saved = true;
      } catch (e) {
        console.warn('Не удалось сохранить запись в IndexedDB:', e);
        setStatus(
          'Запись создана, но браузер не смог её сохранить: ' + (e.message || e.name),
          'error'
        );
      }

      listEl.prepend(renderRecording(record));

      return saved;
    }

    /* ---------- Загрузка сохранённых записей ---------- */
    async function loadSavedRecordings() {
      try {
        const records = await dbGetAll();
        if (!records.length) return;

        records.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        for (const rec of records) {
          listEl.append(renderRecording(rec));
        }

        setStatus('Загружено из памяти браузера: ' + records.length, 'info');
      } catch (e) {
        console.warn('Не удалось загрузить записи из IndexedDB:', e);
      }
    }

    /* ---------- Запись ---------- */
    async function startRecording() {
      if (isRecording || isBusy) return;

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus('Браузер не поддерживает запись звука (нужен HTTPS или localhost).', 'error');
        return;
      }
      if (!window.MediaRecorder) {
        setStatus('Браузер не поддерживает MediaRecorder.', 'error');
        return;
      }

      recordBtn.disabled = true;
      setStatus('Запрос доступа к микрофону…', 'info');

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });
      } catch (err) {
        recordBtn.disabled = false;
        setStatus('Нет доступа к микрофону: ' + (err.message || err.name), 'error');
        return;
      }

      const mimeType = pickMimeType();

      try {
        mediaRecorder = mimeType
          ? new MediaRecorder(stream, { mimeType })
          : new MediaRecorder(stream);
      } catch (err) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
        recordBtn.disabled = false;
        setStatus('Не удалось создать запись: ' + err.message, 'error');
        return;
      }

      chunks = [];
      mediaRecorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };
      mediaRecorder.onstop  = handleStop;
      mediaRecorder.onerror = e => {
        setStatus('Ошибка записи: ' + (e.error && e.error.name || 'неизвестно'), 'error');
      };

      mediaRecorder.start(1000);

      isRecording = true;
      recordBtn.disabled = false;
      recordBtn.classList.add('recording');
      recordBtn.textContent = '■ Остановить запись';
      setStatus('Идёт запись…', 'info');
      startTimer();
    }

    function stopRecording() {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') return;

      isRecording = false;
      stopTimer();
      recordBtn.classList.remove('recording');
      recordBtn.textContent = '● Начать запись';
      recordBtn.disabled = true;

      setStatus('Обработка записи…', 'info');
      mediaRecorder.stop();
    }

    async function handleStop() {
      const name     = getFileName();
      const mimeType = (mediaRecorder && mediaRecorder.mimeType) || 'audio/webm';
      const blob     = new Blob(chunks, { type: mimeType });

      chunks = [];

      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }

      isBusy = true;
      setStatus('Кодирование в MP3…', 'info');

      try {
        const arrayBuffer = await blob.arrayBuffer();

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();

        let audioBuffer;
        try {
          audioBuffer = await ctx.decodeAudioData(arrayBuffer);
        } finally {
          if (ctx.close) ctx.close();
        }

        const mp3Blob = encodeToMp3(audioBuffer, 128);

        const record = {
          id: makeId(),
          name: name,
          blob: mp3Blob,
          duration: audioBuffer.duration,
          createdAt: Date.now()
        };

        const saved = await saveAndRender(record);

        setStatus(
          saved
            ? 'Готово и сохранено в браузере: ' + name + '.mp3'
            : 'Готово: ' + name + '.mp3 (без сохранения в браузере)',
          saved ? 'ok' : 'error'
        );
        timerEl.textContent = '00:00';
      } catch (err) {
        console.error(err);
        setStatus('Не удалось преобразовать в MP3: ' + (err.message || err), 'error');
      } finally {
        isBusy = false;
        recordBtn.disabled = false;
      }
    }

    /* ---------- Обработчики ---------- */
    recordBtn.addEventListener('click', () => {
      if (isRecording) stopRecording();
      else startRecording();
    });

    window.addEventListener('beforeunload', () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        try { mediaRecorder.stop(); } catch (e) {}
      }
      if (stream) stream.getTracks().forEach(t => t.stop());
      objectUrls.forEach(url => URL.revokeObjectURL(url));
      objectUrls.clear();
    });

    /* ---------- Инициализация ---------- */
    loadSavedRecordings();
  })();
  </script>
</body>
</html>
