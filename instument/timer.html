<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0e27">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Таймер обратного отсчёта</title>
    <style>
        /* Возвращаем любимые шрифты Orbitron + Montserrat.
           display=swap — текст виден сразу, шрифт подгружается.
           После первого онлайн-запуска браузер кэширует шрифты,
           и дальше они работают офлайн. */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Montserrat:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --gold: #d4af37;
            --gold-light: #f4d03f;
            --gold-dim: rgba(212, 175, 55, 0.3);
            --bg-dark: #0a0e27;
            --bg-mid: #1a1040;
            --bg-purple: #2d1b69;
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.5);
            --warning: #ff6b35;
            --critical: #ff1744;
            --finished: #ffd700;
            --font-digit: 'Orbitron', 'Courier New', 'Consolas', monospace;
            --font-ui: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-mid) 25%, var(--bg-purple) 50%, var(--bg-mid) 75%, var(--bg-dark) 100%);
            font-family: var(--font-ui);
            padding: 20px;
            position: relative;
        }

        /* Декоративные элементы фона */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(75, 0, 130, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 100, 200, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(138, 43, 226, 0.2) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        .decorative-dots {
            position: fixed;
            z-index: 1;
            pointer-events: none;
        }

        .dots-tl { top: 15px; left: 15px; display: grid; grid-template-columns: repeat(5, 6px); gap: 8px; }
        .dots-tr { top: 15px; right: 15px; display: grid; grid-template-columns: repeat(5, 6px); gap: 8px; }
        .dots-bl { bottom: 15px; left: 15px; display: grid; grid-template-columns: repeat(5, 6px); gap: 8px; }
        .dots-br { bottom: 15px; right: 15px; display: grid; grid-template-columns: repeat(5, 6px); gap: 8px; }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.4);
        }

        .decorative-line {
            position: fixed;
            z-index: 1;
            pointer-events: none;
        }

        .line-tl { top: 50px; left: 60px; width: 80px; height: 2px; background: linear-gradient(90deg, rgba(212, 175, 55, 0.6), transparent); transform: rotate(-30deg); }
        .line-tr { top: 50px; right: 60px; width: 80px; height: 2px; background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.6)); transform: rotate(30deg); }
        .line-bl { bottom: 50px; left: 60px; width: 80px; height: 2px; background: linear-gradient(90deg, rgba(212, 175, 55, 0.6), transparent); transform: rotate(30deg); }
        .line-br { bottom: 50px; right: 60px; width: 80px; height: 2px; background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.6)); transform: rotate(-30deg); }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            max-width: 700px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .title {
            font-family: var(--font-ui);
            font-size: clamp(0.8rem, 2.5vw, 1.2rem);
            font-weight: 600;
            letter-spacing: clamp(3px, 1vw, 6px);
            text-transform: uppercase;
            color: rgba(212, 175, 55, 0.9);
            margin-bottom: clamp(20px, 4vw, 40px);
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        .timer-frame {
            position: relative;
            padding: clamp(25px, 5vw, 50px) clamp(20px, 6vw, 80px);
            background: linear-gradient(145deg, rgba(20, 15, 50, 0.9), rgba(10, 8, 30, 0.95));
            border: 2px solid var(--gold-dim);
            border-radius: 20px;
            box-shadow: 
                0 0 40px rgba(212, 175, 55, 0.1),
                inset 0 0 40px rgba(0, 0, 0, 0.5),
                0 20px 60px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 600px;
        }

        .timer-frame::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 22px;
            background: linear-gradient(145deg, rgba(212, 175, 55, 0.5), transparent, rgba(212, 175, 55, 0.3));
            z-index: -1;
            opacity: 0.5;
        }

        .timer-frame::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 15px;
            pointer-events: none;
        }

        .timer-display {
            font-family: var(--font-digit);
            font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 900;
            color: var(--text-main);
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.5),
                0 0 30px rgba(100, 150, 255, 0.3),
                0 0 60px rgba(100, 150, 255, 0.2);
            letter-spacing: clamp(2px, 1vw, 8px);
            transition: all 0.3s ease;
            display: inline-block;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }

        .timer-display.warning {
            color: var(--warning);
            text-shadow: 
                0 0 10px rgba(255, 107, 53, 0.8),
                0 0 30px rgba(255, 107, 53, 0.5),
                0 0 60px rgba(255, 107, 53, 0.3);
            animation: pulse 0.5s ease-in-out infinite;
        }

        .timer-display.critical {
            color: var(--critical);
            text-shadow: 
                0 0 15px rgba(255, 23, 68, 1),
                0 0 40px rgba(255, 23, 68, 0.7),
                0 0 80px rgba(255, 23, 68, 0.5);
            animation: criticalPulse 0.3s ease-in-out infinite;
        }

        .timer-display.finished {
            color: var(--finished);
            text-shadow: 
                0 0 20px rgba(255, 215, 0, 1),
                0 0 50px rgba(255, 215, 0, 0.8),
                0 0 100px rgba(255, 215, 0, 0.5);
            animation: finishPulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes criticalPulse {
            0%, 100% { transform: scale(1.1); }
            50% { transform: scale(1.3); }
        }

        @keyframes finishPulse {
            0%, 100% { transform: scale(1.2); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; }
        }

        .controls {
            margin-top: clamp(20px, 4vw, 40px);
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group label {
            color: var(--text-dim);
            font-size: clamp(0.75rem, 2vw, 0.9rem);
            font-weight: 400;
        }

        .time-input {
            width: clamp(60px, 15vw, 80px);
            padding: 12px 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--gold-dim);
            border-radius: 10px;
            color: var(--text-main);
            font-family: var(--font-digit);
            font-size: clamp(1rem, 3vw, 1.2rem);
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
        }

        .time-input:focus {
            border-color: rgba(212, 175, 55, 0.8);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .time-input:disabled {
            opacity: 0.5;
        }

        .time-input::-webkit-outer-spin-button,
        .time-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .time-input[type=number] {
            -moz-appearance: textfield;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-family: var(--font-ui);
            font-size: clamp(0.75rem, 2vw, 0.9rem);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            min-height: 44px;
            min-width: 44px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:active::before {
            left: 100%;
        }

        .btn-start {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--bg-mid);
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
        }

        .btn-start:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(212, 175, 55, 0.5);
        }

        .btn-pause {
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(255, 107, 53, 0.3);
        }

        .btn-pause:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(255, 107, 53, 0.5);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-dim);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-reset:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.95) !important;
        }

        .status-text {
            margin-top: 15px;
            font-size: clamp(0.7rem, 1.8vw, 0.85rem);
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            min-height: 1.2em;
        }

        /* Частицы */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(212, 175, 55, 0.6);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        /* Футер */
        .footer {
            position: relative;
            z-index: 10;
            width: 100%;
            text-align: center;
            padding: 20px 15px;
            margin-top: auto;
        }

        .footer-content {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(10, 14, 39, 0.6);
            border: 1px solid var(--gold-dim);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .footer-text {
            font-size: clamp(0.7rem, 1.8vw, 0.85rem);
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .footer-link {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border-bottom: 1px solid transparent;
        }

        .footer-link:hover {
            color: var(--gold-light);
            border-bottom-color: var(--gold-light);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .footer-icon {
            width: 18px;
            height: 18px;
            fill: var(--gold);
            opacity: 0.8;
            flex-shrink: 0;
        }

        /* Мобильная адаптация */
        @media (max-width: 480px) {
            body {
                padding: 15px 10px;
                justify-content: flex-start;
                padding-top: 10vh;
            }

            .decorative-dots { display: none; }
            .decorative-line { display: none; }

            .timer-frame {
                padding: 20px 15px;
            }

            .controls {
                gap: 8px;
                flex-direction: column;
            }

            .input-group {
                flex: 1;
                min-width: 120px;
            }

            .btn {
                flex: 1;
                min-width: 100px;
                padding: 14px 16px;
            }
        }

        @media (max-width: 360px) {
            .timer-display {
                font-size: 2.8rem;
            }
        }

        /* Ориентация landscape на мобильных */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                justify-content: center;
                padding: 10px;
            }

            .container {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 20px;
            }

            .title {
                width: 100%;
                margin-bottom: 10px;
            }

            .timer-frame {
                padding: 20px 30px;
            }

            .controls {
                margin-top: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- Декоративные элементы -->
    <div class="decorative-dots dots-tl">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="decorative-dots dots-tr">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="decorative-dots dots-bl">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="decorative-dots dots-br">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="decorative-line line-tl"></div>
    <div class="decorative-line line-tr"></div>
    <div class="decorative-line line-bl"></div>
    <div class="decorative-line line-br"></div>

    <!-- Частицы -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="title">Таймер обратного отсчёта</div>
        
        <div class="timer-frame">
            <div class="timer-display" id="timerDisplay">00:00</div>
        </div>

        <div class="status-text" id="statusText">Готов к запуску</div>

        <div class="controls">
            <div class="input-group">
                <label for="minutesInput">Мин:</label>
                <input type="number" id="minutesInput" class="time-input" min="0" max="999" value="5" placeholder="0" inputmode="numeric">
            </div>
            <div class="input-group">
                <label for="secondsInput">Сек:</label>
                <input type="number" id="secondsInput" class="time-input" min="0" max="59" value="0" placeholder="0" inputmode="numeric">
            </div>
            <button class="btn btn-start" id="startBtn" onclick="startTimer()">Старт</button>
            <button class="btn btn-pause" id="pauseBtn" onclick="pauseTimer()" disabled>Пауза</button>
            <button class="btn btn-reset" id="resetBtn" onclick="resetTimer()">Сброс</button>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <svg class="footer-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M13.17 17.01c-5.72 0-9-3.93-9.13-10.46h2.56c.09 4.79 2.2 6.82 3.87 7.24V6.55h2.41v4.13c1.66-.18 3.4-2.03 3.99-4.13h2.39a7.94 7.94 0 0 1-3.31 4.71 8.27 8.27 0 0 1 3.83 4.75h-2.64c-.57-1.73-1.99-3.07-4.26-3.29v3.29h-.71z"/>
            </svg>
            <span class="footer-text">Автор: <a href="https://vk.com/archigpt" target="_blank" rel="noopener" class="footer-link">vk.ru/archigpt</a></span>
        </div>
    </footer>

    <script>
        let totalSeconds = 0;
        let remainingSeconds = 0;
        let timerInterval = null;
        let isRunning = false;
        let audioContext = null;

        function initAudio() {
            if (!audioContext) {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.warn('Web Audio API не поддерживается');
                }
            }
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        function playTick() {
            if (!audioContext) return;
            try {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } catch (e) {}
        }

        function playGong() {
            if (!audioContext) return;
            try {
                const duration = 3;
                
                const osc1 = audioContext.createOscillator();
                const gain1 = audioContext.createGain();
                osc1.connect(gain1);
                gain1.connect(audioContext.destination);
                osc1.frequency.value = 150;
                osc1.type = 'sine';
                gain1.gain.setValueAtTime(0.8, audioContext.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                osc1.start(audioContext.currentTime);
                osc1.stop(audioContext.currentTime + duration);

                const osc2 = audioContext.createOscillator();
                const gain2 = audioContext.createGain();
                osc2.connect(gain2);
                gain2.connect(audioContext.destination);
                osc2.frequency.value = 300;
                osc2.type = 'sine';
                gain2.gain.setValueAtTime(0.4, audioContext.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration * 0.7);
                osc2.start(audioContext.currentTime);
                osc2.stop(audioContext.currentTime + duration * 0.7);

                const osc3 = audioContext.createOscillator();
                const gain3 = audioContext.createGain();
                osc3.connect(gain3);
                gain3.connect(audioContext.destination);
                osc3.frequency.value = 450;
                osc3.type = 'sine';
                gain3.gain.setValueAtTime(0.2, audioContext.currentTime);
                gain3.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration * 0.5);
                osc3.start(audioContext.currentTime);
                osc3.stop(audioContext.currentTime + duration * 0.5);
            } catch (e) {}
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateDisplay() {
            const display = document.getElementById('timerDisplay');
            const statusText = document.getElementById('statusText');
            
            display.textContent = formatTime(remainingSeconds);
            
            display.classList.remove('warning', 'critical', 'finished');
            
            if (remainingSeconds <= 10 && remainingSeconds > 0) {
                if (remainingSeconds <= 5) {
                    display.classList.add('critical');
                } else {
                    display.classList.add('warning');
                }
                statusText.textContent = 'Внимание! Осталось мало времени';
            } else if (remainingSeconds === 0 && totalSeconds > 0) {
                display.classList.add('finished');
                statusText.textContent = 'Время вышло!';
            } else if (isRunning) {
                statusText.textContent = 'Отсчёт идёт...';
            } else {
                statusText.textContent = 'Готов к запуску';
            }
        }

        function startTimer() {
            initAudio();
            
            if (isRunning) return;
            
            const minutes = parseInt(document.getElementById('minutesInput').value) || 0;
            const seconds = parseInt(document.getElementById('secondsInput').value) || 0;
            
            if (totalSeconds === 0) {
                totalSeconds = minutes * 60 + seconds;
                remainingSeconds = totalSeconds;
            }
            
            if (totalSeconds <= 0) {
                alert('Пожалуйста, установите время больше 0');
                return;
            }
            
            isRunning = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;
            document.getElementById('minutesInput').disabled = true;
            document.getElementById('secondsInput').disabled = true;
            
            updateDisplay();
            
            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateDisplay();
                
                if (remainingSeconds <= 10 && remainingSeconds > 0) {
                    playTick();
                }
                
                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    isRunning = false;
                    document.getElementById('startBtn').disabled = false;
                    document.getElementById('pauseBtn').disabled = true;
                    playGong();
                }
            }, 1000);
        }

        function pauseTimer() {
            if (!isRunning) return;
            clearInterval(timerInterval);
            isRunning = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('statusText').textContent = 'Пауза';
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            totalSeconds = 0;
            remainingSeconds = 0;
            
            document.getElementById('timerDisplay').textContent = '00:00';
            document.getElementById('timerDisplay').classList.remove('warning', 'critical', 'finished');
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('minutesInput').disabled = false;
            document.getElementById('secondsInput').disabled = false;
            document.getElementById('statusText').textContent = 'Готов к запуску';
        }

        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const count = window.innerWidth < 480 ? 10 : 20;
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        createParticles();
        updateDisplay();
    </script>
</body>
</html>
